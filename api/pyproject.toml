[project]
name = "clueless-closet-api"
version = "0.1.0"
description = "FastAPI backend for the Clueless closet app"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic>=2.7",
    "scikit-learn==1.5.2",  # keep identical to modal_app.py and to the training environment
    "joblib>=1.4",
    "pandas>=2.2",
    "modal>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
